<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crocodic Week-6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Fetch Data using callback, Async or Await, and Promise</h1>

    <div class="button-group">
        <button class="callback-btn">Fetch Data using Callback</button>
        <button class="promise-btn">Fetch Data using Promise</button>
        <button class="async-await-btn">Fetch Data using Async/Await</button>
    </div>

    <div class="status-message">Please click one of the buttons to load the data...</div>

    <div class="user-info">
        <div class="title">User Info</div>
        <p class="name"><Strong>Name: </Strong><span class="name"></span></p>
        <p class="email"><strong>Email: </strong><span class="email"></span></p>
        <p class="city"><strong>City: </strong><span class="city"></span></p>
    </div>

    <div>
        <div class="title"></div>
        <ul class="userPosts" class="user-post">
            Data will be displayed here...
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
