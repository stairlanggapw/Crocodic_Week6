<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crocodic Week-6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Fetch Data using callback, Async or Await, and Promise</h1>

    <div class="button-group">
        <button class="callback-btn" onclick="loadWithCallback()">Fetch Data using Callback</button>
        <button class="promise-btn" onclick="loadWithPromise()">Fetch Data using Promise</button>
        <button class="async-await-btn" onclick="loadWithAsyncAwait()">Fetch Data using Async/Await</button>
    </div>

    <div id="status" class="status-message">Please click one of the buttons to load the data...</div>

    <div class="user-info">
        <div class="title">User Info</div>
        <p class="name"><strong>Name: </strong><span id="userName" class="name"></span></p>
        <p class="email"><strong>Email: </strong><span id="userEmail" class="email"></span></p>
        <p class="city"><strong>City: </strong><span id="userCity" class="city"></span></p>
    </div>

    <div>
        <div class="title">User Posts (5 Posts)</div>
        <ul id="userPosts" class="user-posts">
            Data will be displayed here...
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
